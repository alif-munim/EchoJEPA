# VideoMAE ViT-S CMR (e800) → ACDC diagnosis classification, d=4 attentive probe
# 5-class: DCM=0, HCM=1, MINF=2, NOR=3, RV=4
# Official ACDC challenge split: 100 train / 50 test patients (Bernard et al., IEEE TMI 2018)
app: vjepa
cpus_per_task: 96
folder: /opt/dlami/nvme/evals/cmr/mae_e800_acdc_dx
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 1
num_workers: 8

eval_name: video_classification_frozen
resume_checkpoint: false
tag: cmr-mae-vits-e800-acdc-dx-d4

experiment:
  classifier:
    num_heads: 6
    num_probe_blocks: 4
    num_classes: 5

  data:
    dataset_type: VideoDataset
    dataset_train: /opt/dlami/nvme/data/csv/acdc_dx_train_local.csv
    dataset_val: /opt/dlami/nvme/data/csv/acdc_dx_test_local.csv
    num_classes: 5
    resolution: 224
    frames_per_clip: 16
    frame_step: 1
    num_segments: 2
    num_views_per_segment: 1

  optimization:
    batch_size: 1
    num_epochs: 30
    use_bfloat16: true
    use_pos_embed: false
    multihead_kwargs:
    - {lr: 0.0001, start_lr: 0.0001, final_lr: 0.0, warmup: 0.0, weight_decay: 0.01, final_weight_decay: 0.01}
    - {lr: 0.0001, start_lr: 0.0001, final_lr: 0.0, warmup: 0.0, weight_decay: 0.1, final_weight_decay: 0.1}
    - {lr: 0.0001, start_lr: 0.0001, final_lr: 0.0, warmup: 0.0, weight_decay: 0.4, final_weight_decay: 0.4}
    - {lr: 0.00005, start_lr: 0.00005, final_lr: 0.0, warmup: 0.0, weight_decay: 0.01, final_weight_decay: 0.01}
    - {lr: 0.00005, start_lr: 0.00005, final_lr: 0.0, warmup: 0.0, weight_decay: 0.1, final_weight_decay: 0.1}
    - {lr: 0.00005, start_lr: 0.00005, final_lr: 0.0, warmup: 0.0, weight_decay: 0.4, final_weight_decay: 0.4}

model_kwargs:
  checkpoint: /opt/dlami/nvme/checkpoints/mae_cmr_vits_ep799.pth
  module_name: evals.video_classification_frozen.modelcustom.videomae_encoder
  pretrain_kwargs:
    encoder:
      model_name: vit_small_patch16_224
      tubelet_size: 2
  wrapper_kwargs: {}
