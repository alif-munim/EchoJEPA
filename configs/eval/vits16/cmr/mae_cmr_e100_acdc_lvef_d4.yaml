# VideoMAE ViT-S CMR (e100) → ACDC LVEF regression, d=4 attentive probe
# CMR temporal shortcut trajectory analysis
app: vjepa
cpus_per_task: 96
folder: /opt/dlami/nvme/evals/cmr/mae_e100_acdc_lvef
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 1
num_workers: 8

eval_name: video_classification_frozen
resume_checkpoint: false
tag: cmr-mae-vits-e100-acdc-lvef-d4

experiment:
  classifier:
    task_type: regression
    num_heads: 6
    num_probe_blocks: 4
    num_targets: 1

  data:
    dataset_type: VideoDataset
    dataset_train: /opt/dlami/nvme/data/csv/acdc_train_s3.csv
    dataset_val: /opt/dlami/nvme/data/csv/acdc_test_s3.csv
    target_mean: 45.0
    target_std: 17.0
    resolution: 224
    frames_per_clip: 16
    frame_step: 1
    num_segments: 1
    num_views_per_segment: 1

  optimization:
    batch_size: 1
    num_epochs: 30
    use_bfloat16: true
    use_pos_embed: false
    multihead_kwargs:
    - {lr: 0.0001, start_lr: 0.0001, final_lr: 0.0, warmup: 0.0, weight_decay: 0.01, final_weight_decay: 0.01}
    - {lr: 0.0001, start_lr: 0.0001, final_lr: 0.0, warmup: 0.0, weight_decay: 0.1, final_weight_decay: 0.1}
    - {lr: 0.00005, start_lr: 0.00005, final_lr: 0.0, warmup: 0.0, weight_decay: 0.01, final_weight_decay: 0.01}
    - {lr: 0.00005, start_lr: 0.00005, final_lr: 0.0, warmup: 0.0, weight_decay: 0.1, final_weight_decay: 0.1}
    - {lr: 0.00001, start_lr: 0.00001, final_lr: 0.0, warmup: 0.0, weight_decay: 0.01, final_weight_decay: 0.01}
    - {lr: 0.00001, start_lr: 0.00001, final_lr: 0.0, warmup: 0.0, weight_decay: 0.1, final_weight_decay: 0.1}

model_kwargs:
  checkpoint: /opt/dlami/nvme/checkpoints/mae_cmr_vits_ep99.pth
  module_name: evals.video_classification_frozen.modelcustom.videomae_encoder
  pretrain_kwargs:
    encoder:
      model_name: vit_small_patch16_224
      tubelet_size: 2
  wrapper_kwargs: {}
