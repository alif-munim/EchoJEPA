# MV2SV probe — LVEF, [z_shared ; z_phase] concat, d=1 attentive.
# Tests the joint shared+phase readout without view-specific residual.
app: vjepa
cpus_per_task: 32
folder: evals/vitl/privview/privview_lvef_concat_shared_phase_d1
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 8
num_workers: 8

eval_name: video_classification_frozen
resume_checkpoint: false
tag: privview-lvef-concat-shared-phase-d1

experiment:
  classifier:
    task_type: regression
    num_heads: 16
    num_probe_blocks: 1
    num_targets: 1

  data:
    dataset_type: VideoDataset
    dataset_train: data/csv/echonet_dynamic_train_s3_raw.csv
    dataset_val: data/csv/echonet_dynamic_val_s3_raw.csv
    target_mean: 55.7776
    target_std: 12.4072
    resolution: 224
    frames_per_clip: 16
    frame_step: 2
    num_segments: 2
    num_views_per_segment: 1

  optimization:
    batch_size: 1
    num_epochs: 20
    use_bfloat16: true
    use_pos_embed: false
    multihead_kwargs:
    - {final_lr: 0.0, final_weight_decay: 0.01, lr: 0.0001, start_lr: 0.0001, warmup: 0.0, weight_decay: 0.01}
    - {final_lr: 0.0, final_weight_decay: 0.1,  lr: 0.0001, start_lr: 0.0001, warmup: 0.0, weight_decay: 0.1}
    - {final_lr: 0.0, final_weight_decay: 0.4,  lr: 0.0001, start_lr: 0.0001, warmup: 0.0, weight_decay: 0.4}
    - {final_lr: 0.0, final_weight_decay: 0.01, lr: 0.00005, start_lr: 0.00005, warmup: 0.0, weight_decay: 0.01}
    - {final_lr: 0.0, final_weight_decay: 0.1,  lr: 0.00005, start_lr: 0.00005, warmup: 0.0, weight_decay: 0.1}
    - {final_lr: 0.0, final_weight_decay: 0.4,  lr: 0.00005, start_lr: 0.00005, warmup: 0.0, weight_decay: 0.4}

model_kwargs:
  checkpoint: /opt/dlami/nvme/checkpoints/privview_mv2sv25/latest.pt
  module_name: evals.video_classification_frozen.modelcustom.vit_factorized_encoder
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
    factorized_head:
      feature_mode: concat_shared_phase
      embed_dim: 1024
      shared_dim: 256
      phase_dim: 256
      view_dim: 256
      head_hidden_dim: 1024
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
