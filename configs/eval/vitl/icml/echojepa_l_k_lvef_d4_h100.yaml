# EchoJEPA-L-K LVEF regression, d=4 attentive probe (ICML rebuttal protocol)
# Matches ICML preprint: d=4, 6-head HP grid, 20 epochs, 224px, no warmup
# H100 HyperPod config — paths adapted for /opt/vjepa2
app: vjepa
cpus_per_task: 32
folder: /opt/vjepa2/evals/vitl/icml/lvef
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 8
num_workers: 8

eval_name: video_classification_frozen
resume_checkpoint: false
tag: icml-echojepa-l-k-lvef-d4

experiment:
  classifier:
    task_type: regression
    num_heads: 16
    num_probe_blocks: 4  # ICML protocol: 3 SA + 1 CA
    num_targets: 1

  data:
    dataset_type: VideoDataset
    dataset_train: /opt/vjepa2/data/csv/a4c_b_lvef_train_224px.csv
    dataset_val: /opt/vjepa2/data/csv/a4c_b_lvef_val_224px.csv
    resolution: 224
    frames_per_clip: 16
    frame_step: 2
    num_segments: 2
    num_views_per_segment: 1

  optimization:
    batch_size: 1
    num_epochs: 20
    use_bfloat16: true
    use_pos_embed: false
    multihead_kwargs:
    # --- Group 1: 1e-4 ---
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.1
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.1
    - final_lr: 0.0
      final_weight_decay: 0.4
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.4
    # --- Group 2: 5e-5 ---
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.00005
      start_lr: 0.00005
      warmup: 0.0
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.1
      lr: 0.00005
      start_lr: 0.00005
      warmup: 0.0
      weight_decay: 0.1
    - final_lr: 0.0
      final_weight_decay: 0.4
      lr: 0.00005
      start_lr: 0.00005
      warmup: 0.0
      weight_decay: 0.4

model_kwargs:
  checkpoint: /opt/vjepa2/checkpoints/vitl-kinetics-pt220-an55.pt
  module_name: evals.video_classification_frozen.modelcustom.vit_encoder_multiclip
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      img_temporal_dim_size: null
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
