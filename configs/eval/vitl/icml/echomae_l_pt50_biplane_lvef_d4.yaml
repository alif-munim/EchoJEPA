# EchoMAE-L (pt50) Biplane LVEF multi-view regression, d=4 attentive probe (ICML rebuttal)
# Multi-view: B-mode A4C + B-mode A2C (biplane Simpson's)
# Data: UHN rebuttal subset (9,990 train / 1,000 val), raw LVEF labels
app: vjepa
cpus_per_task: 32
folder: /opt/dlami/nvme/evals/icml/echomae_pt50_biplane_lvef
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 8
num_workers: 8

eval_name: video_classification_frozen_multi
resume_checkpoint: false
tag: icml-echomae-l-pt50-biplane-lvef-d4

experiment:
  classifier:
    task_type: regression
    num_heads: 16
    num_probe_blocks: 4
    use_slot_embeddings: true
    num_views: 2
    clips_per_view: 2
    use_factorized: true
    num_targets: 1

  data:
    dataset_type: VideoGroupDataset
    dataset_train: /opt/dlami/nvme/data/csv/rebuttal/lvef/biplane_lvef_train_10k.csv
    dataset_val: /opt/dlami/nvme/data/csv/rebuttal/lvef/biplane_lvef_val_1k.csv
    num_classes: 1
    resolution: 224
    frames_per_clip: 16
    frame_step: 2
    num_segments: 2
    num_clips_per_video: 2
    num_views_per_segment: 1
    miss_augment_prob: 0.10
    min_present: 1
    target_mean: 57.0569
    target_std: 11.2817

  optimization:
    batch_size: 1
    num_epochs: 20
    use_bfloat16: true
    use_pos_embed: false
    multihead_kwargs:
    # --- Group 1: 1e-4 ---
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.1
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.1
    - final_lr: 0.0
      final_weight_decay: 0.4
      lr: 0.0001
      start_lr: 0.0001
      warmup: 0.0
      weight_decay: 0.4
    # --- Group 2: 5e-5 ---
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.00005
      start_lr: 0.00005
      warmup: 0.0
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.1
      lr: 0.00005
      start_lr: 0.00005
      warmup: 0.0
      weight_decay: 0.1
    - final_lr: 0.0
      final_weight_decay: 0.4
      lr: 0.00005
      start_lr: 0.00005
      warmup: 0.0
      weight_decay: 0.4

model_kwargs:
  checkpoint: /opt/dlami/nvme/checkpoints/echomae_l_mimic_ep50.pth
  module_name: evals.video_classification_frozen_multi.modelcustom.videomae_encoder
  pretrain_kwargs:
    encoder:
      model_name: vit_large_patch16_224
      tubelet_size: 2
  wrapper_kwargs: {}
