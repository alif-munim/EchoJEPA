# EchoSet-JEPA v1 — primary MVP config.
# See docs/echoset_jepa_plan.md §15.

app: echoset_jepa

experiment:
  study_transformer:
    d_clip: 1024
    d_model: 512
    n_layers: 4                      # plan §4.3 — start smaller
    n_heads: 8
    ffn_mult: 4
    dropout_ffn: 0.1
    dropout_attn: 0.0
    max_M: 64

  elements:
    # element_key = (view_family, modality, phase_bucket)       [plan §3.1]
    # quality_bucket is NOT in the key; it is a context-only meta token.
    element_agg: mean                # or: quality_weighted
    tau_quality: 0.5

  meta_dropout:
    view: 0.15
    modality: 0.10
    phase: 0.30
    quality: 0.30

  target_meta:
    include_target_phase: true
    target_quality_token_ablation: false    # gated off by default (plan §3.4)

  target_mode: element_target        # or: full_study_teacher_target

  # MIMIC is {b_mode, color_doppler} only. No spectral / M-mode / TDI clips
  # exist in the manifest. 'whole_modality', 'doppler_holdout', 'bmode_holdout'
  # are redundant with each other for 2-modality data; keep weights but note
  # that their targets coincide.
  modality_cohort: ["b_mode", "color_doppler"]   # declares what's in the manifest

  masking:
    strategy_weights:
      random_element: 0.55
      whole_view_family: 0.25
      whole_modality: 0.10     # equivalent to doppler_holdout/bmode_holdout for MIMIC
      apical_holdout: 0.05
      doppler_holdout: 0.025
      bmode_holdout: 0.025
    mask_ratio_cap: 0.6
    min_context: 1
    min_target: 1

  sampler:
    K_clips: 8                       # fairness unit
    seed: 0
    policy: mixed_modality
    bmode_budget: 6                  # tuned for MIMIC (62% B-mode)
    color_budget: 2                  # tuned for MIMIC (38% color)
    spectral_budget: 0               # no CW/PW/M-mode/TDI in MIMIC
    sample_manifest: s3://REPLACE/study_clip_sample_K8_seed0.parquet

  loss:
    lambda_nce: 0.03                 # sweep in echoset_jepa_v1_K8_lambda_nce_sweep.yaml
    tau_nce: 0.1

  ema:
    tau_start: 0.996
    tau_end: 0.9999
    schedule: cosine

  clip_encoder:
    source: cached
    frozen: true
    cache_s3_prefix: s3://REPLACE/cclip/

  optim:
    lr: 5.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
    warmup_steps: 2000
    main_steps: 50000
    cooldown_steps: 5000
    batch_studies_per_gpu: 32

  ddp:
    nodes: 1
    tasks_per_node: 8
    backend: nccl

  logging:
    log_every_steps: 50
    csv_schema:
      - step
      - loss
      - loss_regress
      - loss_nce
      - var_t
      - cov_off
      - valid_neg_count_same_view_mean
      - valid_neg_count_same_view_min
      - valid_neg_count_same_modality_mean
      - fallback_fraction
      - mask_strategy
      - M_elements_mean

  collapse_monitor:
    var_t_floor: 0.3
    halt_if_below_for_steps: 500
