# EchoSet-JEPA v1 — lambda_nce sweep.
# Runs 3 sub-jobs (0.01, 0.03, 0.05); same sampler, same checkpoints dir layout.

app: echoset_jepa

experiment:
  study_transformer:
    d_clip: 1024
    d_model: 512
    n_layers: 4
    n_heads: 8
    ffn_mult: 4
    dropout_ffn: 0.1
    dropout_attn: 0.0
    max_M: 64

  elements:
    element_agg: mean
    tau_quality: 0.5

  meta_dropout:
    view: 0.15
    modality: 0.10
    phase: 0.30
    quality: 0.30

  target_meta:
    include_target_phase: true
    target_quality_token_ablation: false

  target_mode: element_target

  masking:
    strategy_weights:
      random_element: 0.50
      whole_view_family: 0.25
      whole_modality: 0.15
      apical_holdout: 0.033
      doppler_holdout: 0.033
      bmode_holdout: 0.034
    mask_ratio_cap: 0.6
    min_context: 1
    min_target: 1

  sampler:
    K_clips: 8
    seed: 0
    strategy: view_stratified
    sample_manifest: s3://REPLACE/study_clip_sample_K8_seed0.parquet

  loss:
    lambda_nce_sweep: [0.01, 0.03, 0.05]   # <-- sweep variable
    tau_nce: 0.1

  ema:
    tau_start: 0.996
    tau_end: 0.9999
    schedule: cosine

  clip_encoder:
    source: cached
    frozen: true
    cache_s3_prefix: s3://REPLACE/cclip/

  optim:
    lr: 5.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
    warmup_steps: 2000
    main_steps: 50000
    cooldown_steps: 5000
    batch_studies_per_gpu: 32

  ddp:
    nodes: 1
    tasks_per_node: 8
    backend: nccl

  logging:
    log_every_steps: 50
    csv_schema:
      - step
      - loss
      - loss_regress
      - loss_nce
      - var_t
      - cov_off
      - valid_neg_count_same_view_mean
      - valid_neg_count_same_view_min
      - valid_neg_count_same_modality_mean
      - fallback_fraction
      - mask_strategy
      - M_elements_mean
      - lambda_nce   # tracked per sub-run

  collapse_monitor:
    var_t_floor: 0.3
    halt_if_below_for_steps: 500
