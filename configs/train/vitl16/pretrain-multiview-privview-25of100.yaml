# Privileged Multi-View EchoJEPA (MV2SV) — 25 of 100 continuation.
#
# Single-view student + privileged multi-view teacher. Primary signal
# is rotating pairwise target-view prediction; full N-view fusion is a
# sparse auxiliary applied only on Bernoulli(p_fused) steps and only
# to the z_shared slot. Inference remains single-view.
#
# Loss:
#   L = L_intra
#     + lambda_pair   · L_pair_view_pred
#     + lambda_fused  · L_fused · Bernoulli(p_fused)
#     + lambda_shared · L_same_study_align
#     + lambda_phase  · L_phase_rel
#
# Linear warmup on all non-intra terms over warmup_epochs. Init from
# MIMIC standard V-JEPA e100 (matches phase_relational baseline).
#
# For Phase B Stage 0-3 verification, the existing 3-clip phase_matched
# sampler output is reused: clip_b is the pairwise target; clip_b_neg
# is the wrong-phase hard negative (feeds L_phase_rel + second entry of
# the N=2 fused pool when p_fused fires).

app: vjepa_multiview
nodes: 1
tasks_per_node: 8
cpus_per_task: 12
mem_per_gpu: 100G
folder: /opt/dlami/nvme/checkpoints/privview_mv2sv25

data:
  dataset_type: VideoGroupDataset
  datasets:
    - /opt/dlami/nvme/probe/phase_annotations.parquet
  placeholder_csv: /opt/dlami/nvme/tmp/phase_multiview_placeholder.csv
  batch_size: 32
  crop_size: 224
  patch_size: 16
  dataset_fpcs:
    - 16
  fps: 8
  tubelet_size: 2
  num_workers: 4
  persistent_workers: false
  pin_mem: true

phase_multiview:
  enabled: true
  sampler_type: phase_matched
  phase_annotations_path: /opt/dlami/nvme/probe/phase_annotations.parquet
  sampler_dir: /opt/dlami/nvme/src/vjepa2/classifier/phase/sampler
  # ---- Loss dispatch ----
  multiview_objective: privileged_multiview
  use_intraview_loss: true
  use_crossview_loss: false
  # ---- Sampler settings (inherited from phase_relational baseline) ----
  quality_tiers: ["high", "medium"]
  rr_filter_mode: strict
  require_rr_consistent: true
  frames_per_clip: 16
  frame_step: 1
  allow_frame_step_gt1: false
  sampling_mode: uniform_phase
  phase_tolerance: 0.15
  pairs_per_study: 24
  same_session_only: false
  log_every_steps: 20
  video_uri_mode: mp4
  raw_bucket_prefix: s3://echodata25/mimic-raw-staging
  mp4_bucket_prefix: s3://echodata25/mimic-echo-224px
  view_pair_policy:
    enabled: true
    same_view_prob: 0.35
    same_family_prob: 0.45
    cross_family_prob: 0.20
    require_different_dicom: true
    allow_same_view: true
    resample_attempts: 8
  debug_verify_frame_count: true
  debug_verify_n: 8
  debug_csv_path: null
  view_labels_path: /opt/dlami/nvme/data/view_labels/mimic_view_predictions.csv
  view_label_column: view
  view_confidence_column: view_confidence
  min_view_confidence: 0.60
  delta_phase_mode: controlled_buckets
  delta_phase_buckets: [0.0, 0.125, 0.25, 0.5]
  delta_phase_bucket_probs: [0.40, 0.30, 0.20, 0.10]
  rel_require_same_study_wrong_phase_negative: true
  rel_wrong_phase_min_delta: 0.25
  rel_wrong_phase_strategy: same_view_then_same_family
  rel_allow_missing_hard_negative: false
  rel_hard_negative_fallback: resample_anchor
  rel_max_hard_neg_attempts: 16
  rel_use_confidence_weight: false
  rel_use_distributed_negatives: false
  # ---- MV2SV loss + head config ----
  # v4 first-real-run recipe: pair_view is the primary signal, view_nce
  # enforces cross-view retrieval, pair_shared is a small stabilizer.
  # Fused is on at 0.05 with p_fused=0.25 in mean_shared mode. Phase_rel
  # starts at 0 — enable only after pair_view + fused trajectories are
  # clean. local_motion stays off (requires sampler extension).
  #
  # IMPORTANT: this full run assumes Fix 1 sampler is shipping real
  # target_clip / fused_clips. Until Fix 1 lands, the "target" clip is
  # still the phase-relational triple's clip_b, which is same-view /
  # same-study / different-phase — not a cross-view target. Do not
  # launch a scientific run until Fix 1 is in place.
  privileged_multiview:
    fused_target_mode: mean_shared
    lambda_pair_shared: 0.05
    lambda_pair_view: 0.10
    lambda_view_nce: 0.025
    lambda_shared: 0.05
    lambda_phase: 0.0
    lambda_fused: 0.05
    lambda_local_motion: 0.0
    p_fused: 0.25
    tau_static: 0.10
    tau_phase: 0.10
    tau_view: 0.10
    warmup_epochs: 5
    use_z_view: true
    # Factorized head dims. shared_dim must match view_predictor.target_dim
    # and the SharedProjector output (all handled in train.py).
    embed_dim: 1024
    shared_dim: 256
    phase_dim: 256
    view_dim: 256
    head_hidden_dim: 1024
    view_embedding_dim: 64
    n_phase_freqs: 4
    fusion_num_heads: 8
  total_epochs: 100
  predictor_phase_token:
    enabled: false

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

loss:
  loss_exp: 1.0

mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]

meta:
  dtype: bfloat16
  eval_freq: 9999
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 5
  save_at_end: true
  seed: 345
  use_sdpa: true
  expected_init_checkpoint_tag: mimic_standard_jepa_e100

model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  num_mask_tokens: 10
  use_rope: true
  zero_init_mask_tokens: true

optimization:
  is_anneal: false
  force_load_pretrain: true
  anneal_ckpt: /opt/dlami/nvme/checkpoints/jepa_in21k_vitl_e100.pt
  ema: [0.99925, 0.99925]
  weight_decay: 0.04
  final_weight_decay: 0.04
  ipe: 650
  ipe_scale: 1.0
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4
  warmup: 5
  epochs: 25
  scheduler_total_epochs: 100
  stop_after_epochs: 25
