# MV2SV v5 smoke — STAGE B (target-view NCE, scientific path).
#
# mv2sv_sampler.enabled = true → PairBatch carries real target_clip.
# allow_provisional_clip_b_fallback = false → forward MUST consume it.
# fused off; phase_rel off; local_motion off.
#
# Pass gates (checked by scripts/neurips/phase/mv2sv_gate_check.py):
#   used_clip_b_fallback == 0 every step
#   pct_target_clip_present == 1.0
#   view_nce_valid_neg_count_min >= 1
#   view_nce_fallback_fraction <= 0.3 sustained
#   view_nce_top1 rises above 1/B (random baseline)
#   view_nce_pos_sim - view_nce_neg_sim increases
#   z_view receives grad (verified by its params' grad norm > 0)
#   intraview loss remains within ~20% of base

app: vjepa_multiview
nodes: 1
tasks_per_node: 8
cpus_per_task: 12
mem_per_gpu: 100G
folder: /opt/dlami/nvme/checkpoints/mv2sv_smoke_v5_nce

data:
  dataset_type: VideoGroupDataset
  datasets:
    - /opt/dlami/nvme/probe/phase_annotations.parquet
  placeholder_csv: /opt/dlami/nvme/tmp/phase_multiview_placeholder.csv
  batch_size: 16
  crop_size: 224
  patch_size: 16
  dataset_fpcs:
    - 16
  fps: 8
  tubelet_size: 2
  num_workers: 4
  persistent_workers: false
  pin_mem: true

phase_multiview:
  enabled: true
  sampler_type: phase_matched
  phase_annotations_path: /opt/dlami/nvme/probe/phase_annotations.parquet
  sampler_dir: /opt/dlami/nvme/src/vjepa2/classifier/phase/sampler
  multiview_objective: privileged_multiview
  use_intraview_loss: true
  use_crossview_loss: false
  quality_tiers: ["high", "medium"]
  rr_filter_mode: strict
  require_rr_consistent: true
  frames_per_clip: 16
  frame_step: 1
  allow_frame_step_gt1: false
  sampling_mode: uniform_phase
  phase_tolerance: 0.15
  pairs_per_study: 8
  same_session_only: false
  log_every_steps: 5
  video_uri_mode: mp4
  raw_bucket_prefix: s3://echodata25/mimic-raw-staging
  mp4_bucket_prefix: s3://echodata25/mimic-echo-224px
  view_pair_policy:
    enabled: true
    same_view_prob: 0.35
    same_family_prob: 0.45
    cross_family_prob: 0.20
    require_different_dicom: true
    allow_same_view: true
    resample_attempts: 8
  debug_verify_frame_count: false
  debug_verify_n: 4
  debug_csv_path: null
  view_labels_path: /opt/dlami/nvme/data/view_labels/mimic_view_predictions.csv
  view_label_column: view
  view_confidence_column: view_confidence
  min_view_confidence: 0.60
  delta_phase_mode: controlled_buckets
  delta_phase_buckets: [0.0, 0.125, 0.25, 0.5]
  delta_phase_bucket_probs: [0.40, 0.30, 0.20, 0.10]
  rel_require_same_study_wrong_phase_negative: true
  rel_wrong_phase_min_delta: 0.25
  rel_wrong_phase_strategy: same_view_then_same_family
  rel_allow_missing_hard_negative: false
  rel_hard_negative_fallback: resample_anchor
  rel_max_hard_neg_attempts: 16
  privileged_multiview:
    fused_target_mode: mean_shared
    lambda_pair_shared: 0.05
    lambda_pair_view: 0.10
    lambda_view_nce: 0.025
    lambda_shared: 0.05
    lambda_phase: 0.0
    lambda_fused: 0.0
    lambda_local_motion: 0.0
    p_fused: 0.0
    tau_static: 0.10
    tau_phase: 0.10
    tau_view: 0.10
    warmup_epochs: 1
    use_z_view: true
    embed_dim: 1024
    shared_dim: 256
    phase_dim: 256
    view_dim: 256
    head_hidden_dim: 1024
    view_embedding_dim: 64
    n_phase_freqs: 4
    fusion_num_heads: 8
    # SCIENTIFIC PATH: no fallback; real target_clip required.
    allow_provisional_clip_b_fallback: false
    mv2sv_sampler:
      enabled: true
      target_view_sampling:
        stage: stage2
        a4c_source_targets: [A2C, A5C]
        allowed_targets: [A2C, A5C, PLAX, PSAX-MV, A3C]
        target_dropout: 0.0
        require_different_view: true
      fused_pool:
        enabled: false
        n_fused_min: 2
        n_fused_max: 2
  total_epochs: 100
  predictor_phase_token:
    enabled: false

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

loss:
  loss_exp: 1.0

mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]

meta:
  dtype: bfloat16
  eval_freq: 9999
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 9999
  save_at_end: true
  seed: 345
  use_sdpa: true
  expected_init_checkpoint_tag: mimic_standard_jepa_e100

model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  num_mask_tokens: 10
  use_rope: true
  zero_init_mask_tokens: true

optimization:
  is_anneal: false
  force_load_pretrain: true
  anneal_ckpt: /opt/dlami/nvme/checkpoints/jepa_in21k_vitl_e100.pt
  ema: [0.99925, 0.99925]
  weight_decay: 0.04
  final_weight_decay: 0.04
  ipe: 400
  ipe_scale: 1.0
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4
  warmup: 1
  epochs: 1
  scheduler_total_epochs: 100
  stop_after_epochs: 1
  max_steps: 80
