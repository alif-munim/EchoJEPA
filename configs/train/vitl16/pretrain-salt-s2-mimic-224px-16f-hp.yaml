# SALT Stage 2: Frozen-teacher student training — HyperPod 1-node
# Freeze S1 encoder as teacher, train student encoder + predictor.
# ImageNet-21K init for student (matches other models).
# S1=50ep + S2=50ep = 100 total compute epochs.
app: salt
nodes: 1
tasks_per_node: 8
cpus_per_task: 16
mem_per_gpu: 80G
folder: /opt/dlami/nvme/checkpoints/pretrain/mimic/salt_s2_vitl_224px_16f

data:
  dataset_type: VideoDataset
  datasets:
    - /opt/dlami/nvme/data/csv/mimic_annotations_s3.csv
  datasets_weights: [1.0]
  batch_size: 64                    # 64 × 8 GPUs = 512 effective (student encoder + frozen teacher + predictor)
  crop_size: 224
  patch_size: 16
  dataset_fpcs: [16]
  fps: 8
  tubelet_size: 2
  num_workers: 4
  persistent_workers: true
  pin_mem: true

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.75, 1.35]   # SALT paper: [0.75, 1.35] (was [0.9, 1.1])
  random_resize_scale: [0.3, 1.0]            # SALT paper: [0.3, 1.0] (was [0.5, 1.0])
  reprob: 0.0

loss:
  loss_exp: 1.0                     # L1 loss (SALT paper Eq 2.1: ||...||_1; V-JEPA also uses L1)

mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]

meta:
  dtype: bfloat16
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 5
  max_epoch_checkpoints: 4
  seed: 234
  use_sdpa: true

model:
  stage: 2
  model_name: vit_large             # student encoder
  teacher_model_name: vit_large     # teacher (same size for controlled comparison)
  teacher_checkpoint: /opt/dlami/nvme/checkpoints/pretrain/mimic/salt_s1_vitl_224px_16f/latest.pt
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 16                # SALT paper Table A.2: 16 heads for all predictor sizes (was 12)
  use_mask_tokens: true
  num_mask_tokens: 10
  zero_init_mask_tokens: true
  uniform_power: true
  use_activation_checkpointing: true
  use_rope: true
  use_silu: false
  wide_silu: true

optimization:
  epochs: 80                        # S2=80ep (S1=20 + S2=80 = 100 total, ~1:4 per SALT paper)
  ipe: 300
  ipe_scale: 1.0                    # SALT paper: 1.0 (no virtual early stopping; was 1.25)
  warmup: 33                         # SALT paper: 10K steps → 10000/300ipe = 33ep (was 40ep = 12K steps)
  start_lr: 8.2e-5                  # SALT paper: 2e-4, scaled by sqrt(512/3072)=0.408 for batch 512
  lr: 2.55e-4                       # SALT paper: 6.25e-4, scaled by sqrt(512/3072)=0.408 for batch 512
  final_lr: 1.0e-6                  # SALT paper: 1e-6 cosine decay (was 1.75e-4 constant)
  weight_decay: 0.04
  final_weight_decay: 0.4           # SALT paper: 0.04→0.4 cosine ramp (was 0.04 constant)
  betas: [0.9, 0.95]
  grad_clip: 0.02
  force_load_pretrain: false
