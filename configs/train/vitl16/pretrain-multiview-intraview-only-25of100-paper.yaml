# Paper-ready paired-sampler intraview-only control (25 of 100, batch 32).
#
# Matches the phase-relational method run on every dimension except the loss:
# sampler draws (clip_a, clip_b_pos, clip_b_neg_phase) triples with the
# SAME hard-negative eligibility filter as the method config, so both runs
# train on the identical eligible-anchor set. The loss uses clip_a only.
#
# Init: IN21K -> MIMIC standard V-JEPA e100 (same as jobs 542/548). The
# launcher must invoke scripts/neurips/phase/verify_init_checkpoint.py in
# --strict mode against expected_init_checkpoint_tag before GPU work.
#
# Scheduler horizon is 100 continuation epochs; this run stops at 25.
app: vjepa_multiview
nodes: 1
tasks_per_node: 8
cpus_per_task: 12
mem_per_gpu: 100G
folder: /opt/dlami/nvme/checkpoints/final_paired_iv25_paper

data:
  dataset_type: VideoGroupDataset
  datasets:
    - /opt/dlami/nvme/probe/phase_annotations.parquet
  placeholder_csv: /opt/dlami/nvme/tmp/phase_multiview_placeholder.csv
  # Matched to method. 32/GPU * 8 GPUs = 256 samples/step. Method loads 3
  # clips/sample (clip_a + clip_b_pos + clip_b_neg_phase); control also
  # loads 3 clips/sample so sampler eligibility + teacher memory match.
  batch_size: 32
  crop_size: 224
  patch_size: 16
  dataset_fpcs:
    - 16
  fps: 8
  tubelet_size: 2
  # 3 clips per sample (matched to method); train.py sets num_clips=3
  # automatically when multiview_objective in {intraview_only, phase_relational}.
  num_workers: 4
  persistent_workers: false    # pair_df swaps per epoch; must stay false
  pin_mem: true

phase_multiview:
  enabled: true
  sampler_type: phase_matched
  phase_annotations_path: /opt/dlami/nvme/probe/phase_annotations.parquet
  sampler_dir: /opt/dlami/nvme/src/vjepa2/classifier/phase/sampler
  # ---- Loss dispatch ----
  multiview_objective: intraview_only
  use_intraview_loss: true
  use_crossview_loss: false
  # ---- Matched sampler settings (shared with method) ----
  quality_tiers: ["high", "medium"]
  rr_filter_mode: strict
  require_rr_consistent: true
  frames_per_clip: 16
  frame_step: 1
  allow_frame_step_gt1: false
  sampling_mode: uniform_phase
  phase_tolerance: 0.15
  pairs_per_study: 24
  same_session_only: false
  log_every_steps: 20
  video_uri_mode: mp4
  raw_bucket_prefix: s3://echodata25/mimic-raw-staging
  mp4_bucket_prefix: s3://echodata25/mimic-echo-224px
  view_pair_policy:
    enabled: true
    same_view_prob: 0.35
    same_family_prob: 0.45
    cross_family_prob: 0.20
    require_different_dicom: true
    allow_same_view: true
    resample_attempts: 8
  debug_verify_frame_count: true
  debug_verify_n: 8
  debug_csv_path: null
  view_labels_path: /opt/dlami/nvme/data/view_labels/mimic_view_predictions.csv
  view_label_column: view
  view_confidence_column: view_confidence
  min_view_confidence: 0.60
  # ---- Controlled delta-phase buckets (shared with method) ----
  delta_phase_mode: controlled_buckets
  delta_phase_buckets: [0.0, 0.125, 0.25, 0.5]
  delta_phase_bucket_probs: [0.40, 0.30, 0.20, 0.10]
  # ---- Mandatory hard-negative sampler (shared with method) ----
  # The loss ignores clip_b_neg_phase but the filter is applied so the
  # control trains on the identical eligible-anchor set as the method.
  rel_require_same_study_wrong_phase_negative: true
  rel_wrong_phase_min_delta: 0.25
  rel_wrong_phase_strategy: same_view_then_same_family
  rel_allow_missing_hard_negative: false
  rel_hard_negative_fallback: resample_anchor
  rel_max_hard_neg_attempts: 16
  rel_use_confidence_weight: false
  rel_use_distributed_negatives: false
  total_epochs: 100
  predictor_phase_token:
    enabled: false

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

loss:
  loss_exp: 1.0

mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]

meta:
  dtype: bfloat16
  eval_freq: 9999
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 5
  save_at_end: true
  seed: 234
  use_sdpa: true
  # Init-checkpoint allowlist tag, verified by
  # scripts/neurips/phase/verify_init_checkpoint.py. Must resolve to the
  # MIMIC standard V-JEPA e100 checkpoint used by jobs 542/548.
  expected_init_checkpoint_tag: mimic_standard_jepa_e100

model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  num_mask_tokens: 10
  use_rope: true
  zero_init_mask_tokens: true

optimization:
  is_anneal: false
  force_load_pretrain: true
  anneal_ckpt: /opt/dlami/nvme/checkpoints/jepa_in21k_vitl_e100.pt
  ema: [0.99925, 0.99925]
  weight_decay: 0.04
  final_weight_decay: 0.04
  # IPE is re-derived at runtime from the sampler; hint matches bs=32.
  ipe: 650
  ipe_scale: 1.0
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4
  warmup: 5
  epochs: 25
  scheduler_total_epochs: 100
  stop_after_epochs: 25
