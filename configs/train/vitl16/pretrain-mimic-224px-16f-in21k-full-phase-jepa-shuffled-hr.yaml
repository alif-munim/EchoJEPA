# Full Phase-JEPA with shuffled-HR control. Identical to
# pretrain-mimic-224px-16f-in21k-full-phase-jepa.yaml except shuffled_hr=true.
# Both the predictor Δφ AND the mask-phi sampler see the derangement-shuffled
# HR (FrameTime/NumberOfFrames/fps preserved).
app: vjepa
nodes: 1
tasks_per_node: 8
cpus_per_task: 16
mem_per_gpu: 80G
folder: /opt/dlami/nvme/checkpoints/pretrain/mimic/vjepa2_vitl_224px_16f_in21k_full_phi_jepa_shuffled_hr

data:
  dataset_type: VideoDataset
  datasets:
    - /opt/dlami/nvme/data/csv/mimic_annotations_s3.csv
  datasets_weights: [1.0]
  batch_size: 128
  crop_size: 224
  patch_size: 16
  dataset_fpcs: [16]
  fps: 8
  tubelet_size: 2
  num_workers: 4
  persistent_workers: true
  pin_mem: true
  phase_metadata_csv: /opt/dlami/nvme/data/csv/mimic_clip_phase_metadata.csv

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

loss:
  loss_exp: 1.0

mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [0.25, 0.25]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [0.25, 0.25]

phase_mask:
  phase_aware: true
  phase_buckets:
    local: [0.05, 0.15]
    mid_cycle: [0.20, 0.35]
    opposite_phase: [0.45, 0.55]
    same_phase_next_beat: true
  # same_phase_next_beat disabled: infeasible on 16-frame clips.
  phase_bucket_probs:
    local: 0.30
    mid_cycle: 0.40
    opposite_phase: 0.30
    same_phase_next_beat: 0.0
  phase_fallback: random
  require_valid_hr: true
  shuffled_hr: true
  phase_max_attempts: 20
  phase_seed: 0

meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 5
  seed: 234
  use_sdpa: true

model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  num_mask_tokens: 10
  use_rope: true
  zero_init_mask_tokens: true
  phase_conditioned: true
  n_phase_freqs: 16
  phase_drop_p: 0.15

optimization:
  is_anneal: false
  force_load_pretrain: true
  anneal_ckpt: /opt/dlami/nvme/checkpoints/vitl_in21k.pt
  ema: [0.99925, 0.99925]
  weight_decay: 0.04
  final_weight_decay: 0.04
  ipe: 300
  ipe_scale: 1.25
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4
  warmup: 40
  epochs: 100
