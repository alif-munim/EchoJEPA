# SALT Stage 2: Student trained against V-Pixel e99 teacher
# Tests whether SALT's "inherited disuse" persists with a post-shortcut teacher.
#
# All hyperparameters match job 388 exactly (from params-pretrain.yaml).
# Only changes: folder name, teacher_checkpoint path.
#
# The teacher is the extended V-Pixel encoder at e99 (from the e100-resume S1 run).
# At e99, MAE's attentive matched-frame gap has reached -0.065 (the probe-utilization
# shift has developed). This contrasts with the primary SALT arm's e20 teacher,
# where the gap was still +0.033 (pre-shift).
app: salt
nodes: 1
tasks_per_node: 8
cpus_per_task: 16
mem_per_gpu: 80G
folder: /opt/dlami/nvme/checkpoints/pretrain/mimic/salt_s2_vpixel_e99_teacher_v1

data:
  dataset_type: VideoDataset
  datasets:
    - /opt/dlami/nvme/data/csv/mimic_annotations_s3.csv
  datasets_weights: [1.0]
  batch_size: 64
  crop_size: 224
  patch_size: 16
  dataset_fpcs: [16]
  fps: 8
  tubelet_size: 2
  num_workers: 4
  persistent_workers: true
  pin_mem: true

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

loss:
  loss_exp: 1.0                     # L1 loss (matches job 388)

mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]

meta:
  dtype: bfloat16
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 5
  max_epoch_checkpoints: 4
  seed: 234
  use_sdpa: true

model:
  stage: 2
  model_name: vit_large
  teacher_model_name: vit_large
  teacher_checkpoint: /opt/dlami/nvme/checkpoints/pretrain/mimic/salt_s1_vitl_224px_16f_e100/latest.pt
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12              # Matches job 388 (not paper-spec 16)
  use_mask_tokens: true
  num_mask_tokens: 10
  zero_init_mask_tokens: true
  uniform_power: true
  use_activation_checkpointing: true
  use_rope: true
  use_silu: false
  wide_silu: true

optimization:
  epochs: 80                       # Matches job 388
  ipe: 300
  ipe_scale: 1.25                  # Matches job 388
  warmup: 40                       # Matches job 388
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4               # Constant LR (matches job 388)
  weight_decay: 0.04
  final_weight_decay: 0.04        # Constant WD (matches job 388)
  betas: [0.9, 0.95]
  grad_clip: 0.02
  force_load_pretrain: false       # Random student init (matches job 388)
