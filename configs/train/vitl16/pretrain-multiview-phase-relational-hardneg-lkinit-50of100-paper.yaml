# Phase-relational JEPA method, L-K-init variant (50 of 100, batch 32,
# mandatory same-study wrong-phase hard negative).
#
# Init: EchoJEPA-L-K e100 (Kinetics-400 -> MIMIC, runs/11 lineage) instead
# of the JEPA IN21K e100 used by the original V4 paper run. This lets us
# test whether the L-K spatiotemporal prior + phase-relational objective
# compounds.
#
# Loss / sampler / head config identical to the IN21K-init paper variant:
#   configs/train/vitl16/pretrain-multiview-phase-relational-hardneg-25of100-paper.yaml
# (Differences are only: anneal_ckpt, stop_after_epochs, folder,
#  expected_init_checkpoint_tag.)
#
# Scheduler: 100-epoch cosine horizon, stop at 50 (FLOPs-matched to the
# V4-resume-to-e150 IN21K run for a clean head-to-head).
app: vjepa_multiview
nodes: 1
tasks_per_node: 8
cpus_per_task: 12
mem_per_gpu: 100G
folder: /opt/dlami/nvme/checkpoints/final_phase_rel_hardneg_lkinit50_paper

data:
  dataset_type: VideoGroupDataset
  datasets:
    - /opt/dlami/nvme/probe/phase_annotations.parquet
  placeholder_csv: /opt/dlami/nvme/tmp/phase_multiview_placeholder.csv
  batch_size: 32
  crop_size: 224
  patch_size: 16
  dataset_fpcs:
    - 16
  fps: 8
  tubelet_size: 2
  num_workers: 4
  persistent_workers: false
  pin_mem: true

phase_multiview:
  enabled: true
  sampler_type: phase_matched
  phase_annotations_path: /opt/dlami/nvme/probe/phase_annotations.parquet
  sampler_dir: /opt/dlami/nvme/src/vjepa2/classifier/phase/sampler
  multiview_objective: phase_relational
  use_intraview_loss: true
  use_crossview_loss: false
  quality_tiers: ["high", "medium"]
  rr_filter_mode: strict
  require_rr_consistent: true
  frames_per_clip: 16
  frame_step: 1
  allow_frame_step_gt1: false
  sampling_mode: uniform_phase
  phase_tolerance: 0.15
  pairs_per_study: 24
  same_session_only: false
  log_every_steps: 20
  video_uri_mode: mp4
  raw_bucket_prefix: s3://echodata25/mimic-raw-staging
  mp4_bucket_prefix: s3://echodata25/mimic-echo-224px
  view_pair_policy:
    enabled: true
    same_view_prob: 0.35
    same_family_prob: 0.45
    cross_family_prob: 0.20
    require_different_dicom: true
    allow_same_view: true
    resample_attempts: 8
  debug_verify_frame_count: true
  debug_verify_n: 8
  debug_csv_path: null
  view_labels_path: /opt/dlami/nvme/data/view_labels/mimic_view_predictions.csv
  view_label_column: view
  view_confidence_column: view_confidence
  min_view_confidence: 0.60
  delta_phase_mode: controlled_buckets
  delta_phase_buckets: [0.0, 0.125, 0.25, 0.5]
  delta_phase_bucket_probs: [0.40, 0.30, 0.20, 0.10]
  rel_require_same_study_wrong_phase_negative: true
  rel_wrong_phase_min_delta: 0.25
  rel_wrong_phase_strategy: same_view_then_same_family
  rel_allow_missing_hard_negative: false
  rel_hard_negative_fallback: resample_anchor
  rel_max_hard_neg_attempts: 16
  rel_use_confidence_weight: false
  rel_use_distributed_negatives: false
  relational:
    embed_dim: 1024
    rel_projector_dim: 256
    rel_predictor_hidden_dim: 1024
    rel_view_embedding_dim: 64
    rel_num_phase_frequencies: 4
    rel_temperature: 0.10
    lambda_rel: 0.05
    rel_warmup_epochs: 5
    rel_negative_mode: hard_plus_batch
    rel_mask_same_study_batch_negatives: true
    rel_use_confidence_weight: false
    rel_use_distributed_negatives: false
    target_projector_trainable: true
  total_epochs: 100
  predictor_phase_token:
    enabled: false

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

loss:
  loss_exp: 1.0

mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]

meta:
  dtype: bfloat16
  eval_freq: 9999
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 5
  save_at_end: true
  seed: 234
  use_sdpa: true
  # New tag: L-K e100 (different sha from IN21K e100). The sbatch adds
  # this entry to verify_init_checkpoint.py's allowlist before launch.
  expected_init_checkpoint_tag: mimic_lk_jepa_e100

model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  num_mask_tokens: 10
  use_rope: true
  zero_init_mask_tokens: true

optimization:
  is_anneal: false
  # Force-load from the L-K e100 (K400->MIMIC) checkpoint. This is the
  # IN21K-free init arc: K400 video prior -> MIMIC self-supervised ->
  # phase-relational fine-tune.
  force_load_pretrain: true
  anneal_ckpt: /opt/dlami/nvme/checkpoints/echojepa_l_k_vitl_e100.pt
  ema: [0.99925, 0.99925]
  weight_decay: 0.04
  final_weight_decay: 0.04
  ipe: 650
  ipe_scale: 1.0
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4
  warmup: 5
  # Scheduler horizon is 100 continuation epochs; stop at 50 for a
  # FLOPs-matched comparison with V4 IN21K-init-resumed-to-e50 (i.e.,
  # global IN21K-e150). Both runs accumulate 50 * IPE phase-relational
  # steps on top of an e100 init.
  epochs: 50
  scheduler_total_epochs: 100
  stop_after_epochs: 50
