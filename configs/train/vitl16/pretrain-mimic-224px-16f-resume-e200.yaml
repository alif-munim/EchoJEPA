# Resume JEPA IN21K from e100 → e200
# Extends the canonical run 376 to double the training budget.
# Purpose: test whether JEPA's temporal encoding persists under extended training.
#
# Key changes from original config:
#   - epochs: 200 (was 240, but we only ran 100; now targeting 200)
#   - force_load_pretrain: false (resuming from latest.pt, not loading fresh init)
#   - load_checkpoint: true (resume from checkpoint)
#   - warmup: 0 (warmup already done in original run)
#   - save_every_freq: 25 (save at e125, e150, e175, e200 for frame shuffling)
app: vjepa
nodes: 1
tasks_per_node: 8
cpus_per_task: 16
mem_per_gpu: 220G
folder: /opt/dlami/nvme/jepa_e200
data:
  dataset_type: VideoDataset
  datasets:
  - /opt/dlami/nvme/data/csv/mimic_annotations_s3.csv
  datasets_weights:
  - 1.0
  batch_size: 128
  crop_size: 224
  patch_size: 16
  dataset_fpcs:
  - 16
  fps: 8
  tubelet_size: 2
  num_workers: 8
  persistent_workers: true
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.9
  - 1.1
  random_resize_scale:
  - 0.5
  - 1.0
  reprob: 0.0
loss:
  loss_exp: 1.0
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: null
  save_every_freq: 5
  seed: 234
  use_sdpa: true
model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  num_mask_tokens: 10
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  is_anneal: false
  force_load_pretrain: false
  anneal_ckpt: null

  ema: [0.99925, 0.99925]
  weight_decay: 0.04
  final_weight_decay: 0.04

  ipe: 300
  ipe_scale: 1.25

  start_lr: 1.75e-4
  lr: 1.75e-4
  final_lr: 1.75e-4

  warmup: 0
  epochs: 200
