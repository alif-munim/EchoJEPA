# configs/train/vitl16/pretrain-21-mimic-224px-16f-resume-e100.yaml
# V-JEPA 2.1 ViT-L resume from epoch 100 on MIMIC-IV-Echo, new seed.
# Checkpoint: s3://echodata25/neurips/encoders/vjepa2_1_vitl_mimic_e100.pt
#
# Resume mechanism: load_checkpoint: true looks for latest.pt in folder.
# The sbatch script downloads the e100 checkpoint as latest.pt.
# Different seed (777) from original run (234) for data ordering diversity.
#
# Launch (HyperPod):
#   sbatch scripts/vjepa21_resume_e100.sbatch
app: vjepa_2_1
nodes: 1
tasks_per_node: 8
cpus_per_task: 16
mem_per_gpu: 220G
folder: /opt/dlami/nvme/checkpoints/pretrain_21/mimic/vjepa2_1_vitl_224px_16f_resume_e100

data:
  dataset_type: VideoDataset
  datasets:
    - /opt/dlami/nvme/data/csv/mimic_annotations_s3.csv
  datasets_weights: [1.0]
  batch_size: 128
  crop_size: 224
  patch_size: 16
  dataset_fpcs: [16]
  fps: 8
  tubelet_size: 2
  num_workers: 4
  persistent_workers: true
  pin_mem: true

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

loss:
  loss_exp: 1.0
  shift_by_n: 0
  predict_all: true
  weight_distance_loss: false
  offset_context_loss: false

mask:
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 8
    spatial_scale: [0.15, 0.15]
    temporal_scale: [1.0, 1.0]
  - aspect_ratio: [0.75, 1.5]
    full_complement: false
    max_keep: null
    max_temporal_keep: 1.0
    num_blocks: 2
    spatial_scale: [0.7, 0.7]
    temporal_scale: [1.0, 1.0]

meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: null
  save_every_freq: 5
  seed: 777
  use_sdpa: true

model:
  model_name: vit_large
  # Distilled model architecture (matches checkpoint)
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  n_output_distillation: 1
  # V-JEPA 2.1 features
  lambda_value_vid: 0.5
  lambda_value_img: 0.5
  lambda_progressive: false
  levels_predictor: 1
  normalize_predictor: false
  modality_embedding: true
  img_temporal_dim_size: 1
  interpolate_rope: true
  # Standard settings
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
  has_cls_first: false
  is_causal: false
  pred_is_causal: false
  n_registers: 0
  n_registers_predictor: 0

optimization:
  # Resume — no force_load, just pick up latest.pt
  force_load_pretrain: false
  anneal_ckpt: null
  is_anneal: false

  ema: [0.99925, 0.99925]
  weight_decay: 0.04
  final_weight_decay: 0.04

  # LR scaled from paper: 5.25e-4 * (1024/3072) = 1.75e-4
  # Warmup → constant (final_lr = lr)
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4

  ipe: 300
  ipe_scale: 1.25
  warmup: 40

  # 240 epochs total — resuming from 100, so 140 epochs remaining
  epochs: 240
