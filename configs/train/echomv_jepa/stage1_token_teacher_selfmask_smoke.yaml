# Arm B — Stage-1 token-online + teacher target token self-masking.
#
# Hypothesis: the EMA teacher is collapsing to per-element identity because
# when its target-slot is unmasked, the identity map is a valid (easy) solution.
# If we mask a fraction of target-element tokens on the TEACHER side (preserving
# meta), the teacher must produce target embeddings that depend on context peers;
# the student then has a target it cannot trivially match by per-element identity.
#
# Only the teacher's target-element tokens are masked. Context tokens and the
# student path are untouched. Target-slot meta remains view/modality/phase only.
# No measurement-site leak.
#
# Default: p_target_token_mask=0.5, with tiny NCE and cov to avoid collapse.

app: echomv_jepa

experiment:
  study_transformer:
    d_clip: 1024
    d_model: 512
    n_layers: 4
    n_heads: 8
    ffn_mult: 4
    dropout_ffn: 0.1
    dropout_attn: 0.0
    max_M: 64

  elements:
    element_agg: mean
    tau_quality: 0.5

  meta_dropout:
    view: 0.15
    modality: 0.10
    phase: 0.30
    quality: 0.30

  target_meta:
    include_target_phase: true
    target_quality_token_ablation: false

  projector:
    num_modalities: 1
    d_hidden: 1024
    d_proj: 256

  modality_cohort: ["b_mode", "color_doppler"]

  masking:
    strategy_weights:
      random_element: 0.55
      whole_view_family: 0.25
      whole_modality: 0.10
      apical_holdout: 0.05
      doppler_holdout: 0.025
      bmode_holdout: 0.025
    mask_ratio_cap: 0.6
    min_context: 1
    min_target: 1

  sampler:
    K_clips: 8
    seed: 0
    policy: mixed_modality
    bmode_budget: 6
    color_budget: 2
    spectral_budget: 0
    sample_manifest: s3://sagemaker-hyperpod-lifecycle-495467399120-usw2/vjepa2-artifacts/echoset_jepa/study_clip_sample_K8_seed0_train.parquet

  loss:
    lambda_nce: 0.01
    tau_nce: 0.1
    lambda_cov: 0.001
    var_floor: 0.0

  # Arm B — teacher target self-masking.
  teacher_selfmask:
    p_target_token_mask: 0.5       # token path; 0.0 in pooled
    p_target_self_mask: 0.0        # pooled path; 0.0 in token mode

  ema:
    tau_start: 0.996
    tau_end: 0.9999
    schedule: cosine

  clip_encoder:
    source: online
    frozen: true
    config_path: /opt/dlami/nvme/echomv_cache/encoder.yaml
    token_spatial_pool: 2
    spatial_hw: 14
    temporal_tubelets: 8

  optim:
    lr: 5.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
    warmup_steps: 50
    main_steps: 150
    cooldown_steps: 25
    batch_studies_per_gpu: 8

  ddp:
    nodes: 1
    tasks_per_node: 8
    backend: nccl

  diagnostics:
    peer_drop_every_n_steps: 25
    extra_every_n_steps: 25
    halt_z_cosine_vs_v1_threshold: 0.98
    halt_z_cosine_vs_v1_consec_steps: 5000

  logging:
    log_every_steps: 10
    csv_schema:
      - step
      - loss
      - loss_regress
      - loss_nce
      - loss_cov
      - var_t
      - cov_off
      - z_cosine_vs_v1
      - z_cosine_vs_isolated
      - z_cosine_vs_peer_drop
      - student_context_delta
      - target_meta_only_cos
      - target_meta_only_gap
      - matched_rank_top1
      - matched_rank_top5
      - pos_minus_hardneg_gap
      - valid_neg_count_same_view_mean
      - valid_neg_count_same_view_min
      - valid_neg_count_same_modality_mean
      - fallback_fraction
      - teacher_selfmask_rate
      - mask_strategy
      - M_elements_mean

  collapse_monitor:
    var_t_floor: 0.3
    halt_if_below_for_steps: 500

folder: /tmp/echomv_jepa/arm_b_teacher_selfmask
seed: 0
checkpoint_every_steps: 200
num_workers: 4
