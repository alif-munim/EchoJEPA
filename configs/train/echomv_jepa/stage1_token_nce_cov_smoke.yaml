# Arm A — Stage-1 token-online + matched NCE + covariance regularizer.
#
# Hypothesis: per-element-identity collapse from Stage-1 cosine-only is caused
# by (i) nothing distinguishing this study from another study's same-(view,
# modality, phase) elements, and (ii) no anti-correlation pressure on the
# projection subspace. Matched NCE over other-study matched-metadata negatives
# supplies (i); an off-diagonal covariance penalty supplies (ii).
#
# Smoke budget: 225 steps, same K=8 manifest, 8x H100.
#
# Full smoke pass criteria (§20.2.a extended — see Part 3 report template):
#   loss finite
#   cov_off bounded or decreasing
#   matched_rank_top1 > 1/B (above random within batch)
#   student_context_delta > 0.02 by end
#   target_meta_only_gap > 0.05
#   no NaNs, no cache/decode failure beyond expected ~0.1%

app: echomv_jepa

experiment:
  study_transformer:
    d_clip: 1024
    d_model: 512
    n_layers: 4
    n_heads: 8
    ffn_mult: 4
    dropout_ffn: 0.1
    dropout_attn: 0.0
    max_M: 64

  elements:
    element_agg: mean
    tau_quality: 0.5

  meta_dropout:
    view: 0.15
    modality: 0.10
    phase: 0.30
    quality: 0.30

  target_meta:
    include_target_phase: true
    target_quality_token_ablation: false

  projector:
    num_modalities: 1
    d_hidden: 1024
    d_proj: 256

  modality_cohort: ["b_mode", "color_doppler"]

  masking:
    strategy_weights:
      random_element: 0.55
      whole_view_family: 0.25
      whole_modality: 0.10
      apical_holdout: 0.05
      doppler_holdout: 0.025
      bmode_holdout: 0.025
    mask_ratio_cap: 0.6
    min_context: 1
    min_target: 1

  sampler:
    K_clips: 8
    seed: 0
    policy: mixed_modality
    bmode_budget: 6
    color_budget: 2
    spectral_budget: 0
    sample_manifest: s3://sagemaker-hyperpod-lifecycle-495467399120-usw2/vjepa2-artifacts/echoset_jepa/study_clip_sample_K8_seed0_train.parquet

  # Arm A knobs — the two additions over stage1_token_online.yaml.
  loss:
    lambda_nce: 0.01          # default; sweep {0.005, 0.03} in follow-up configs
    tau_nce: 0.1
    lambda_cov: 0.001         # default; sweep {0.005} in follow-up configs
    var_floor: 0.0            # off by default; simple off-diag penalty only

  ema:
    tau_start: 0.996
    tau_end: 0.9999
    schedule: cosine

  clip_encoder:
    source: online
    frozen: true
    config_path: /opt/dlami/nvme/echomv_cache/encoder.yaml
    token_spatial_pool: 2
    spatial_hw: 14
    temporal_tubelets: 8

  optim:
    lr: 5.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.95]
    warmup_steps: 50
    main_steps: 150
    cooldown_steps: 25
    batch_studies_per_gpu: 8

  ddp:
    nodes: 1
    tasks_per_node: 8
    backend: nccl

  diagnostics:
    peer_drop_every_n_steps: 25
    extra_every_n_steps: 25
    halt_z_cosine_vs_v1_threshold: 0.98
    halt_z_cosine_vs_v1_consec_steps: 5000

  logging:
    log_every_steps: 10
    csv_schema:
      - step
      - loss
      - loss_regress
      - loss_nce
      - loss_cov
      - var_t
      - cov_off
      - z_cosine_vs_v1
      - z_cosine_vs_isolated
      - z_cosine_vs_peer_drop
      - student_context_delta
      - target_meta_only_cos
      - target_meta_only_gap
      - matched_rank_top1
      - matched_rank_top5
      - pos_minus_hardneg_gap
      - valid_neg_count_same_view_mean
      - valid_neg_count_same_view_min
      - valid_neg_count_same_modality_mean
      - fallback_fraction
      - teacher_selfmask_rate
      - mask_strategy
      - M_elements_mean

  collapse_monitor:
    var_t_floor: 0.3
    halt_if_below_for_steps: 500

folder: /tmp/echomv_jepa/arm_a_nce_cov
seed: 0
checkpoint_every_steps: 200
num_workers: 4
