# BYOL-Video ViT-S CMR SAX — config-fixed variant.
# Two changes vs pretrain-byol-cmr-224px-16f-in21k.yaml:
#   1. ema:    [0.996, 0.996] -> [0.99925, 0.99925]  (matches refs/vjepa2 and echo BYOL)
#   2. epochs: 100 -> 800                            (matches CMR MAE/JEPA comparators)
# Warmup raised from 10 to 40 epochs to keep the same 5% warmup fraction.
# All other knobs identical to the original CMR BYOL recipe.
app: byol_video
nodes: 1
tasks_per_node: 8
cpus_per_task: 12
mem_per_gpu: 80G
folder: /opt/dlami/nvme/checkpoints/pretrain/cmr/byol_vits_224px_16f_in21k_fixed

data:
  dataset_type: VideoDataset
  datasets:
    - /opt/dlami/nvme/data/csv/cmr_pretrain.csv
  datasets_weights: [1.0]
  batch_size: 16
  crop_size: 224
  patch_size: 16
  dataset_fpcs: [16]
  num_clips: 2
  fps: 25
  tubelet_size: 2
  num_workers: 4
  persistent_workers: true
  pin_mem: true

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 10
  seed: 234
  use_sdpa: true

model:
  model_name: vit_small
  uniform_power: true
  use_activation_checkpointing: false
  use_rope: true
  proj_hidden_dim: 2048
  proj_dim: 256
  pred_hidden_dim: 2048

optimization:
  is_anneal: false
  force_load_pretrain: true
  anneal_ckpt: /opt/dlami/nvme/checkpoints/vits_in21k.pt
  ema: [0.99925, 0.99925]   # was [0.996, 0.996]; matches refs/vjepa2 and echo BYOL
  weight_decay: 0.04
  final_weight_decay: 0.04
  ipe: 85
  ipe_scale: 1.0
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4
  warmup: 40               # was 10; 5% of 800 epochs (same fraction as CMR JEPA/MAE)
  epochs: 800              # was 100; matches CMR MAE/JEPA trajectory length
