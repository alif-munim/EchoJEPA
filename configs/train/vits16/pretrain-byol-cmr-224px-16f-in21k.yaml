# BYOL-Video ViT-S pretraining on CMR SAX — ImageNet-21K init
# Cross-modality validation for NeurIPS temporal shortcut paper.
# Controlled comparison: JEPA vs BYOL vs MAE on 21.8K CMR SAX cine clips.
#
# Dataset calibration: batch_size=16 × 8 GPUs = 128 eff BS (×2 clips = 256 samples/step)
# ipe=85 ≈ one data pass per epoch. 100 epochs = 100 data passes.
#
# Launch (single node, 8 GPUs):
#   python -m app.main --fname configs/train/vits16/pretrain-byol-cmr-224px-16f-in21k.yaml \
#     --devices cuda:0 cuda:1 cuda:2 cuda:3 cuda:4 cuda:5 cuda:6 cuda:7
app: byol_video
nodes: 1
tasks_per_node: 8
cpus_per_task: 12
mem_per_gpu: 80G
folder: /opt/dlami/nvme/checkpoints/pretrain/cmr/byol_vits_224px_16f_in21k

data:
  dataset_type: VideoDataset
  datasets:
    - /opt/dlami/nvme/data/csv/cmr_pretrain.csv
  datasets_weights: [1.0]
  batch_size: 16
  crop_size: 224
  patch_size: 16
  dataset_fpcs: [16]
  num_clips: 2
  fps: 25
  tubelet_size: 2
  num_workers: 4
  persistent_workers: true
  pin_mem: true

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.5, 1.0]
  reprob: 0.0

meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: false
  read_checkpoint: null
  save_every_freq: 10
  seed: 234
  use_sdpa: true

model:
  model_name: vit_small
  uniform_power: true
  use_activation_checkpointing: false
  use_rope: true
  proj_hidden_dim: 2048
  proj_dim: 256
  pred_hidden_dim: 2048

optimization:
  is_anneal: false
  force_load_pretrain: true
  anneal_ckpt: /opt/dlami/nvme/checkpoints/vits_in21k.pt
  ema: [0.996, 0.996]
  weight_decay: 0.04
  final_weight_decay: 0.04
  ipe: 85
  ipe_scale: 1.0
  start_lr: 3.33e-5
  lr: 1.75e-4
  final_lr: 1.75e-4
  warmup: 10
  epochs: 100
