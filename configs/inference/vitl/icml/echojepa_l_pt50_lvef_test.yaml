# EchoJEPA-L pt50 LVEF test inference (ICML rebuttal)
# Runs best d=4 probe on held-out test set
app: vjepa
cpus_per_task: 32
folder: /mnt/custom-file-systems/efs/fs-0049217cdf69186d7_fsap-0fa7145b64eaa046b/vjepa2/evals/vitb/icml/echojepa_l_pt50_lvef_test
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 3
num_workers: 16

eval_name: video_classification_frozen
resume_checkpoint: true
tag: icml-echojepa-l-pt50-lvef-d4-test
val_only: true

probe_checkpoint: /mnt/custom-file-systems/efs/fs-0049217cdf69186d7_fsap-0fa7145b64eaa046b/vjepa2/evals/vitb/icml/echojepa_l_pt50_lvef/video_classification_frozen/icml-echojepa-l-pt50-lvef-d4/best.pt
predictions_save_path: /mnt/custom-file-systems/efs/fs-0049217cdf69186d7_fsap-0fa7145b64eaa046b/vjepa2/predictions/icml/echojepa_l_pt50_lvef_test.csv

experiment:
  classifier:
    task_type: regression
    num_heads: 16
    num_probe_blocks: 4
    num_targets: 1

  data:
    dataset_type: VideoDataset
    dataset_train: /mnt/custom-file-systems/efs/fs-0049217cdf69186d7_fsap-0fa7145b64eaa046b/vjepa2/data/csv/a4c_b_lvef_test_224px.csv
    dataset_val: /mnt/custom-file-systems/efs/fs-0049217cdf69186d7_fsap-0fa7145b64eaa046b/vjepa2/data/csv/a4c_b_lvef_test_224px.csv
    resolution: 224
    frames_per_clip: 16
    frame_step: 2
    num_segments: 2
    num_views_per_segment: 1

  optimization:
    batch_size: 16
    num_epochs: 1
    use_bfloat16: true
    use_pos_embed: false
    multihead_kwargs:
    # Must match training grid (6 heads) so checkpoint loads correctly
    - {lr: 0.0, start_lr: 0.0, final_lr: 0.0, weight_decay: 0.01, final_weight_decay: 0.01, warmup: 0.0}
    - {lr: 0.0, start_lr: 0.0, final_lr: 0.0, weight_decay: 0.1, final_weight_decay: 0.1, warmup: 0.0}
    - {lr: 0.0, start_lr: 0.0, final_lr: 0.0, weight_decay: 0.4, final_weight_decay: 0.4, warmup: 0.0}
    - {lr: 0.0, start_lr: 0.0, final_lr: 0.0, weight_decay: 0.01, final_weight_decay: 0.01, warmup: 0.0}
    - {lr: 0.0, start_lr: 0.0, final_lr: 0.0, weight_decay: 0.1, final_weight_decay: 0.1, warmup: 0.0}
    - {lr: 0.0, start_lr: 0.0, final_lr: 0.0, weight_decay: 0.4, final_weight_decay: 0.4, warmup: 0.0}

model_kwargs:
  checkpoint: /mnt/custom-file-systems/efs/fs-0049217cdf69186d7_fsap-0fa7145b64eaa046b/vjepa2/checkpoints/echojepa-l-pt50.pt
  module_name: evals.video_classification_frozen.modelcustom.vit_encoder_multiclip
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      img_temporal_dim_size: null
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
