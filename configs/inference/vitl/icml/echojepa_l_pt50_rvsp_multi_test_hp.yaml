# EchoJEPA-L pt50 RVSP multi-view test inference — HyperPod version
app: vjepa
cpus_per_task: 32
folder: /opt/dlami/nvme/evals/icml/rvsp_noise_grid
mem_per_gpu: 80G
nodes: 1
tasks_per_node: 8
num_workers: 8

eval_name: video_classification_frozen_multi
resume_checkpoint: true
tag: icml-echojepa-l-pt50-rvsp-d4-full-noise
val_only: true

probe_checkpoint: /opt/dlami/nvme/probes/echojepa_l_pt50_rvsp_multi_best.pt

experiment:
  classifier:
    task_type: regression
    num_heads: 16
    num_probe_blocks: 4
    use_slot_embeddings: true
    num_views: 2
    clips_per_view: 2
    use_factorized: true
    num_targets: 1

  data:
    dataset_type: VideoGroupDataset
    dataset_train: /opt/dlami/nvme/data/csv/rvsp_test.csv
    dataset_val: /opt/dlami/nvme/data/csv/rvsp_test.csv
    num_classes: 1
    resolution: 224
    frames_per_clip: 16
    frame_step: 1
    num_segments: 2
    num_clips_per_video: 2
    num_views_per_segment: 1
    miss_augment_prob: 0.0
    min_present: 1
    target_mean: 34.4650
    target_std: 14.0130

  optimization:
    batch_size: 8
    num_epochs: 1
    use_bfloat16: true
    use_pos_embed: false
    multihead_kwargs:
    - {final_lr: 0.0, final_weight_decay: 0.01, lr: 0.0, start_lr: 0.0, warmup: 0.0, weight_decay: 0.01}
    - {final_lr: 0.0, final_weight_decay: 0.1, lr: 0.0, start_lr: 0.0, warmup: 0.0, weight_decay: 0.1}
    - {final_lr: 0.0, final_weight_decay: 0.4, lr: 0.0, start_lr: 0.0, warmup: 0.0, weight_decay: 0.4}
    - {final_lr: 0.0, final_weight_decay: 0.01, lr: 0.0, start_lr: 0.0, warmup: 0.0, weight_decay: 0.01}
    - {final_lr: 0.0, final_weight_decay: 0.1, lr: 0.0, start_lr: 0.0, warmup: 0.0, weight_decay: 0.1}
    - {final_lr: 0.0, final_weight_decay: 0.4, lr: 0.0, start_lr: 0.0, warmup: 0.0, weight_decay: 0.4}

model_kwargs:
  checkpoint: /opt/dlami/nvme/checkpoints/echojepa_l_mimic_ep50.pt
  module_name: evals.video_classification_frozen_multi.modelcustom.vit_encoder_multiclip
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      img_temporal_dim_size: null
      model_name: vit_large
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
  wrapper_kwargs:
    max_frames: 128
    use_pos_embed: false
    return_per_clip: true
